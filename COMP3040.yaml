about_exam:
  - content: |
      exam 目录中有 2021 级的回忆版试题可供参考。
      以下为 2019 级的考试情况：
      考得不难，但是还是得好好复习的~
      选择、填空、判断各 10 题，各占 20 分；大题 4 题，各占 10 分。
      选择、填空很简单，判断题需要好好推敲。
      大题如果好好看了数学原理的话也挺简单的。
      最后一题是设计一个密码系统（其实就是实验五的题目复述一遍）。
    submitter:
      name: "2019 级"
      link: ""
